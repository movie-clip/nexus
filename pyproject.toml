[project]
name = "nexus"
version = "0.1.0"
description = "Standalone LangGraph engine for unattended, durable pipelines"
authors = [
    { name = "anton.ametov", email = "antonametov88@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.22",
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.32",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
